    resources:
    - name: ?CreateArchive
      path: /?CreateArchive
      operations:
      - name: createarchive
        method: POST
        description: Amazon EventBridge Create Archive
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ?ListArchives
