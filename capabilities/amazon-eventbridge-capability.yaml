naftiko: 1.0.0-alpha2
info:
  label: Amazon EventBridge API
  description: Amazon EventBridge is a serverless event bus service that makes it easy to connect your applications with data
    from a variety of sources. EventBridge delivers a stream of real-time data from your own applications, SaaS applications,
    and AWS services and routes that data to targets such as AWS Lambda, Amazon SNS, Amazon SQS, and more.
  tags:
  - Amazon
  - Eventbridge
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
