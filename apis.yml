name: Amazon EventBridge

description: Amazon EventBridge is a serverless event bus service that makes it easy to connect your applications with data from a variety of
  sources. EventBridge delivers a stream of real-time data from your own applications, SaaS applications, and AWS services and routes that data
  to targets such as Lambda, SNS, SQS, and more.

